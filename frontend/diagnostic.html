<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="diag.title">Диагностика — Sabaqtas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <!-- Порядок важен: mock.js готовит данные, profile.js даёт доступ
       к localStorage (api.js записывает туда итог), api.js отдаёт данные,
       diagnostic.js рисует экран. defer сохраняет этот порядок. -->
  <!-- Язык интерфейса. Подключается первым: остальные скрипты
       могут звать t() при отрисовке. -->
  <script src="js/i18n.js" defer></script>
  <script src="js/mock.js" defer></script>
  <script src="js/profile.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/diagnostic.js" defer></script>
</head>
<body>

  <!-- Простая шапка: только логотип, ссылок по секциям здесь нет -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="index.html"><svg class="wordmark-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" focusable="false"><rect x="2" y="4" width="18" height="6" rx="2" fill="#00A3C4"/><rect x="6" y="13" width="18" height="6" rx="2" fill="#5BC0D6"/><rect x="10" y="22" width="18" height="6" rx="2" fill="#F5B301"/></svg>Sabaqtas</a>
    </div>
  </header>

  <main class="container page-narrow">

    <!-- ===== СОСТОЯНИЕ 1: ВОПРОС ===== -->
    <section id="state-question">

      <h1 class="page-title" data-i18n="diag.heading">Диагностика</h1>
      <p class="page-subtitle" data-i18n="diag.subtitle">
        Отвечай честно. Если не знаешь — так и скажи, это поможет найти пробел быстрее.
      </p>
      <!-- Личная строка из анкеты. Пустая и скрытая, пока профиля нет. -->
      <p class="profile-line is-hidden" id="profile-line"></p>

      <div class="question-card">
        <!-- Тема и класс текущего вопроса -->
        <p class="question-topic" id="question-topic"></p>
        <p class="question-text" id="question-text"></p>
        <!-- Кнопки ответов создаёт diagnostic.js -->
        <div class="answers" id="answers"></div>
      </div>

      <!-- Лесенка растёт по мере ответов: ученик видит, как система
           спускается по классам вниз -->
      <p class="chain-title is-hidden" id="chain-title" data-i18n="diag.chainTitle">Что уже проверили</p>
      <ol class="stairs" id="chain"></ol>

    </section>

    <!-- ===== СОСТОЯНИЕ 2: РЕЗУЛЬТАТ ===== -->
    <section id="state-result" class="is-hidden">

      <h1 class="page-title" data-i18n="diag.resultFound">Нашли, где ты застрял</h1>

      <ol class="stairs stairs-result" id="result-chain"></ol>

      <div class="result-card">
        <p class="result-text" id="result-text"></p>
        <p class="result-source" id="result-source"></p>
      </div>

      <div class="result-actions">
        <a class="button button-primary" href="dashboard.html" data-i18n="diag.makePlan">Составить план</a>
        <a class="button button-secondary" href="chat.html" data-i18n="diag.askAi">Спросить ИИ по теме</a>
        <button class="link-button" type="button" id="restart" data-i18n="diag.restart">Пройти заново</button>
      </div>

    </section>

    <!-- Сообщение, если бэкенд не ответил -->
    <p class="error-message is-hidden" id="error"></p>

  </main>

</body>
</html>
