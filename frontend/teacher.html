<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель учителя — Sabaqtas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/teacher-mock.js" defer></script>
  <script src="js/teacher.js" defer></script>
</head>
<body>

  <header class="site-header teacher-header">
    <div class="container header-inner teacher-header-inner">
      <a class="wordmark" href="index.html"><svg class="wordmark-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" focusable="false"><rect x="2" y="4" width="18" height="6" rx="2" fill="#00A3C4"/><rect x="6" y="13" width="18" height="6" rx="2" fill="#5BC0D6"/><rect x="10" y="22" width="18" height="6" rx="2" fill="#F5B301"/></svg>Sabaqtas</a>
      <h1 class="teacher-header-title">Панель учителя · <span id="class-title"></span></h1>
    </div>
  </header>

  <main class="container teacher-page">
    <!-- Сводка помогает быстро увидеть состояние всего класса. -->
    <section class="teacher-summary" aria-label="Сводка по классу">
      <div class="tiles">
        <article class="tile">
          <p class="tile-number" id="tile-students"></p>
          <p class="tile-label">Учеников в классе</p>
        </article>
        <article class="tile">
          <p class="tile-number" id="tile-closed"></p>
          <p class="tile-label">Закрыто пробелов</p>
        </article>
        <article class="tile">
          <p class="tile-number" id="tile-gaveup"></p>
          <p class="tile-label">Застряли на этой неделе</p>
        </article>
      </div>
    </section>

    <section class="teacher-section" aria-labelledby="students-heading">
      <h2 class="teacher-heading" id="students-heading">Ученики</h2>
      <!-- На телефоне таблица прокручивается внутри этой обёртки. -->
      <div class="table-scroll" tabindex="0">
        <table class="students-table">
          <thead>
            <tr>
              <th scope="col">Ученик</th>
              <th scope="col">Корневой пробел</th>
              <th scope="col">Класс пробела</th>
              <th scope="col">Прогресс</th>
              <th scope="col">Застревал раз</th>
            </tr>
          </thead>
          <tbody id="students-body"></tbody>
        </table>
      </div>
    </section>

    <section class="teacher-section" aria-labelledby="topics-heading">
      <h2 class="teacher-heading" id="topics-heading">Что западает у класса</h2>
      <div class="class-topics" id="class-topics"></div>
    </section>

    <section class="teacher-section" aria-labelledby="add-topic-heading">
      <h2 class="teacher-heading" id="add-topic-heading">Добавить тему</h2>
      <form class="add-topic" id="add-topic-form">
        <div class="teacher-form-field teacher-form-field-wide">
          <label for="add-title">Тема</label>
          <input class="add-input" id="add-title" type="text" required>
        </div>
        <div class="teacher-form-field">
          <label for="add-grade">Класс</label>
          <select class="add-input" id="add-grade">
            <option value="5">5 класс</option>
            <option value="6">6 класс</option>
            <option value="7">7 класс</option>
            <option value="8">8 класс</option>
            <option value="9" selected>9 класс</option>
          </select>
        </div>
        <div class="teacher-form-field teacher-form-field-source">
          <label for="add-source">Источник (параграф)</label>
          <input class="add-input" id="add-source" type="text" placeholder="Например: Алгебра, 9 класс, §12" required>
        </div>
        <button class="button button-primary add-submit" type="submit">Добавить</button>
      </form>
    </section>
  </main>
</body>
</html>
