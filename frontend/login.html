<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Sabaqtas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <!-- Экран работает целиком в браузере: ни mock.js, ни api.js не нужны -->
  <script src="js/login.js" defer></script>
</head>
<body>

  <!-- Простая шапка: только логотип -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="index.html"><svg class="wordmark-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" focusable="false"><rect x="2" y="4" width="18" height="6" rx="2" fill="#00A3C4"/><rect x="6" y="13" width="18" height="6" rx="2" fill="#5BC0D6"/><rect x="10" y="22" width="18" height="6" rx="2" fill="#F5B301"/></svg>Sabaqtas</a>
    </div>
  </header>

  <main class="container page-narrow">

    <h1 class="page-title">Перед началом</h1>
    <p class="page-subtitle">
      Скажи, в каком ты классе и какова твоя цель обучения. Дальше диагностика
      найдёт тему, которую надо закрепить.
    </p>

    <!-- ===== АНКЕТА ===== -->
    <form class="login-form" id="login-form">

      <div class="teacher-form-field">
        <label for="login-name">Имя</label>
        <input class="add-input" id="login-name" type="text" required>
      </div>

      <div class="teacher-form-field">
        <label for="login-pass">Пароль</label>
        <input class="add-input" id="login-pass" type="password" minlength="4" required>
      </div>

      <div class="teacher-form-field">
        <label for="login-grade">Класс</label>
        <!-- Готовая цепочка диагностики идёт 8 -> 7 -> 6 -> 5, поэтому она
             осмысленна для 8 и 9 класса: девятикласснику проверяется база
             на год ниже. Остальным классам нужны свои цепочки, их пока нет. -->
        <select class="add-input" id="login-grade">
          <option value="5" disabled>5 класс — скоро</option>
          <option value="6" disabled>6 класс — скоро</option>
          <option value="7" disabled>7 класс — скоро</option>
          <option value="8" selected>8 класс</option>
          <option value="9">9 класс</option>
          <option value="10" disabled>10 класс — скоро</option>
          <option value="11" disabled>11 класс — скоро</option>
        </select>
      </div>

      <div class="teacher-form-field">
        <label for="login-subject">Предмет</label>
        <!-- Физика и химия выключены: у диагностики пока есть данные только
             по математике. Включённая «Физика» показала бы математические
             вопросы под физической вывеской — заметная ложь на демо. -->
        <select class="add-input" id="login-subject">
          <option value="Математика" selected>Математика</option>
          <option value="Физика" disabled>Физика — скоро</option>
          <option value="Химия" disabled>Химия — скоро</option>
        </select>
      </div>

      <div class="teacher-form-field">
        <label for="login-goal">Цель</label>
        <select class="add-input" id="login-goal">
          <option value="gaps" selected>Закрыть пробелы за прошлые годы</option>
          <option value="current">Подтянуть текущую тему</option>
          <option value="ent">Подготовка к ЕНТ</option>
        </select>
      </div>

      <button class="button button-primary" type="submit">Начать</button>

    </form>

    <!-- Сообщение о том, что заполнено не так. Пустое и скрытое, пока всё хорошо. -->
    <p class="error-message is-hidden" id="error"></p>

    <!-- ===== ДЕМО-ВХОД =====
         Для жюри: два готовых аккаунта, чтобы посмотреть продукт
         без заполнения анкеты. -->
    <section class="demo-entry" aria-label="Демо-вход">
      <p class="demo-entry-note">Или открой готовый аккаунт и просто посмотри продукт:</p>
      <div class="demo-entry-buttons">
        <button class="button button-secondary" type="button" id="demo-student">Посмотреть как ученик</button>
        <button class="button button-secondary" type="button" id="demo-teacher">Посмотреть как учитель</button>
      </div>
    </section>

  </main>

</body>
</html>
